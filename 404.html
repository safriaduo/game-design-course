<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Game Design</title>
  <meta name="robots" content="noindex">
  <script>
    // GitHub Pages serves this for unknown paths: send visitors back to the site root.
    // On a project site (user.github.io/repo/) the root is the first path segment.
    (function () {
      var base = /\.github\.io$/.test(location.hostname) ? '/' + location.pathname.split('/')[1] + '/' : '/';
      location.replace(base + '#/');
    })();
  </script>
</head>
<body>
  <p><a href="./">Game Design</a></p>
</body>
</html>
